name: Build and Publish Plugins

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Compile plugins
        run: |
          mkdir -p .js/plugins/english
          for src in plugins/english/*.ts; do
            [[ -f "$src" ]] || continue
            echo "Compiling $src"
            npx tsc "$src" \
              --outDir .js/plugins/english \
              --target ES5 \
              --module CommonJS \
              --moduleResolution node \
              --esModuleInterop \
              --skipLibCheck \
              --noCheck \
              --noResolve
          done

      - name: Build manifest
        run: npm run build:manifest

      - name: Rewrite manifest URLs for GitHub
        run: |
          python3 - <<'PY'
          import json, os
          manifest_path = ".serve/plugins.min.json"
          if not os.path.exists(manifest_path):
              manifest_path = ".dist/plugins.min.json"

          with open(manifest_path) as f:
              data = json.load(f)

          repo = os.environ.get("GITHUB_REPOSITORY")
          BASE = f"https://raw.githubusercontent.com/{repo}/plugins"

          for plugin in data:
              plugin["url"] = f"{BASE}/.js/plugins/english/{plugin['id']}.js"
              plugin["iconUrl"] = f"{BASE}/static/{plugin['id']}.png"

          with open(manifest_path, "w") as f:
              json.dump(data, f, separators=(",", ":"))

          print("Rewrote", len(data), "entries")
          for p in data:
              print(" ", p["id"], "->", p["url"])
          PY

      - name: Prepare publish folder
        run: |
          mkdir -p publish/.js/plugins/english
          mkdir -p publish/static

          # Copy compiled plugins
          cp .js/plugins/english/*.js publish/.js/plugins/english/ 2>/dev/null || true

          # Copy static assets (icons) if they exist
          cp -r public/static/* publish/static/ 2>/dev/null || true

          # Copy the manifest
          if [ -f .serve/plugins.min.json ]; then
            cp .serve/plugins.min.json publish/plugins.min.json
          elif [ -f .dist/plugins.min.json ]; then
            cp .dist/plugins.min.json publish/plugins.min.json
          fi

          ls -la publish/
          ls -la publish/.js/plugins/english/

      - name: Publish to plugins branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./publish
          publish_branch: plugins
          force_orphan: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
